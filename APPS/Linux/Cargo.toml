[package]
name = "synapsebox-linux"
version = "1.1.1"
edition = "2021"
rust-version = "1.80"
description = "Cliente de escritorio de SynapseBox para Linux: sincronización de carpetas y acceso a tu nube"
license = "MIT"

[dependencies]
gtk4 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Se compila en cada PC con las optimizaciones para su propio procesador (ver install.sh)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
