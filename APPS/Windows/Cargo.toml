[package]
name = "synapsebox-windows"
version = "1.3.0"
edition = "2021"
rust-version = "1.80"
description = "SynapseBox para Windows: ventana (synapsebox.exe) y línea de órdenes (sbox.exe) con sincronización de carpetas"
license = "MIT"

[lib]
name = "synapsebox_core"
path = "src/lib.rs"

[[bin]]
name = "synapsebox"
path = "src/main.rs"

[[bin]]
name = "sbox"
path = "src/bin/sbox.rs"

[dependencies]
# HTTPS con el almacén de certificados de Windows (schannel): no necesita OpenSSL para compilar
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7"
png = "0.17"
rfd = "0.15"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
